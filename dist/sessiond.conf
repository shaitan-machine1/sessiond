cgroup_root = "/sys/fs/cgroup"
runtime_parent = "/run/user"
state_dir = "/run/sessiond"
linger = false

[session]
# Natural master-exit grace for ScheduleCloseSession; 0s requests immediate work.
close_grace = "10s"

[session.shutdown]
mode = "scope"
master_timeout = "10s"
scope_timeout = "10s"

[user_service_manager]
# Runtime readiness applies to every UID. Manager startup/reuse requires this threshold.
# min_uid = 1000
launcher = "/usr/libexec/sessiond/sessiond-user-launcher"
# Private stack: NEVER include sessiond-session or either public PAM module.
pam_service = "sessiond-user"
ready_timeout = "30s"

[user_service_manager.shutdown]
mode = "master"
master_timeout = "10s"
scope_timeout = "10s"
