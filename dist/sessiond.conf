cgroup_root = "/sys/fs/cgroup"
runtime_parent = "/run/user"
state_dir = "/run/sessiond"
linger = false

[session]
open_timeout = "30s"

[session.shutdown]
mode = "scope"
leader_timeout = "10s"
scope_timeout = "10s"

[user_service_manager]
# Start a user manager only for UIDs >= 1000; 0 enables it for every UID.
# Sessions and runtime directories are always created, independently of this.
# min_uid = 1000
launcher = "/usr/libexec/sessiond/sessiond-user-launcher"
pam_service = "sessiond-user"
ready_timeout = "30s"

[user_service_manager.shutdown]
mode = "leader"
leader_timeout = "10s"
scope_timeout = "10s"
