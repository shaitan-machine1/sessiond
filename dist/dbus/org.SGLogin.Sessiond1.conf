<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <allow send_destination="org.SGLogin.Sessiond1"/>
    <deny send_type="signal" send_interface="org.SGLogin.Sessiond1.Manager" send_path="/org/SGLogin/Sessiond1"/>
  </policy>
  <policy user="root">
    <allow own="org.SGLogin.Sessiond1"/>
    <allow send_type="signal" send_interface="org.SGLogin.Sessiond1.Manager" send_path="/org/SGLogin/Sessiond1"/>
  </policy>
</busconfig>
