[package]
name = "lib-sessiond"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Local session containment, synchronous Rust/C sessiond SDK and wire contract"
readme = "README.md"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["local-open", "blocking-client", "c-api"]
local-open = ["dep:uuid"]
blocking-client = ["dep:dbus"]
c-api = ["local-open", "blocking-client"]
wire-serde = ["dep:serde", "dep:zvariant"]

[dependencies]
dbus = { workspace = true, optional = true }
lib-scoped.workspace = true
libc.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true
uuid = { workspace = true, optional = true }
zvariant = { version = "=5.9.2", optional = true }

[dev-dependencies]
tempfile = "3"
