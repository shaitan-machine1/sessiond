[workspace]
members = [
  "crates/pam-ffi",
  "crates/pam-sessiond",
  "crates/sessiond",
  "crates/sessionctl",
  "crates/sessiond-user-launcher",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
humantime = "2.3"
libc = "0.2"
nix = { version = "0.31", features = ["fs", "process", "signal", "user"] }
pam-ffi = { path = "crates/pam-ffi" }
scope-id = { git = "ssh://git@github.com/shaitan-machine1/scoped.git", tag = "v0.1.0" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.48", features = ["macros", "rt", "signal", "sync", "time", "process", "io-util"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v7"] }
zbus = { version = "6.0.0", features = ["tokio"] }
