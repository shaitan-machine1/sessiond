[workspace]
members = [
  "crates/lib-scoped",
  "crates/lib-sessiond",
  "crates/pam-ffi",
  "crates/pam-sessiond",
  "crates/sessiond",
  "crates/sessiond-user-launcher",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dbus = "0.9.12"
dbus-crossroads = "0.5.3"
humantime = "2.3"
libc = "0.2"
nix = { version = "0.31", features = ["fs", "poll", "process", "signal", "user"] }
lib-scoped = { path = "crates/lib-scoped" }
lib-sessiond = { path = "crates/lib-sessiond" }
pam-ffi = { path = "crates/pam-ffi" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v7"] }
